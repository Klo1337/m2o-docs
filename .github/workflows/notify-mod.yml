name: Request documentation deployment

on:
  push:
    branches: [main]
    paths:
      - "guides/**"
      - ".github/workflows/notify-mod.yml"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify the private M2O pipeline
        env:
          GH_TOKEN: ${{ secrets.M2O_DOCS_TRIGGER_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::M2O_DOCS_TRIGGER_TOKEN is not configured; skipping deployment request"
            exit 0
          fi
          gh api --method POST repos/mafia2online/Mod/dispatches \
            -f event_type=documentation-updated \
            -F 'client_payload[channel]=testing'
